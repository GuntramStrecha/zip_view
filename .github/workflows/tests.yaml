name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:  # Allow manual triggering

env:
  CLANG_TIDY_VERSION: "18.1.8"
  VERBOSE: 1

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest with GCC (coverage build)
          - os: ubuntu-latest
            cpp_compiler: g++
            build_type: Release
            cmake_flags: "-DCODE_COVERAGE=ON"
          # ubuntu-latest with GCC (no coverage)
          - os: ubuntu-latest
            cpp_compiler: g++
            build_type: Release
            cmake_flags: ""
          # ubuntu-latest with Clang
          - os: ubuntu-latest
            cpp_compiler: clang++
            build_type: Release
            cmake_flags: ""
          # ubuntu-24.04-arm with GCC (native ARM64)
          - os: ubuntu-24.04-arm
            cpp_compiler: g++
            build_type: Release
            cmake_flags: ""
          # ubuntu-24.04-arm with Clang (native ARM64)
          - os: ubuntu-24.04-arm
            cpp_compiler: clang++
            build_type: Release
            cmake_flags: ""
          # ubuntu-24.04-arm with ARM32 cross-compile
          - os: ubuntu-24.04-arm
            cpp_compiler: arm-linux-gnueabihf-g++
            build_type: Release
            cmake_flags: "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-arm"
          # windows-latest with MSVC
          - os: windows-latest
            cpp_compiler: cl
            build_type: Release
            cmake_flags: ""

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install ARM 32-bit toolchain and runtime
      if: matrix.cpp_compiler == 'arm-linux-gnueabihf-g++'
      run: |
        sudo dpkg --add-architecture armhf
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf qemu-user libc6-armhf-cross libstdc++6-armhf-cross

    - name: Install gcovr
      if: matrix.cmake_flags == '-DCODE_COVERAGE=ON'
      run: sudo apt-get install -y gcovr

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        ${{ matrix.cmake_flags }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --target ZipViewTests --parallel

    - name: Test
      run: ctest --test-dir ${{ steps.strings.outputs.build-output-dir }} -C ${{ matrix.build_type }} --output-on-failure
      env:
        QEMU_LD_PREFIX: ${{ matrix.cpp_compiler == 'arm-linux-gnueabihf-g++' && '/usr/arm-linux-gnueabihf' || '' }}

    - name: Generate code coverage
      if: matrix.cmake_flags == '-DCODE_COVERAGE=ON'
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --target coverage

    - name: Publish to codecov
      if: matrix.cmake_flags == '-DCODE_COVERAGE=ON'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: ${{ runner.os }}
        name: ${{ runner.os }}-coverage
        files: ${{ steps.strings.outputs.build-output-dir }}/coverage.xml

    - name: Upload Coverage Report
      if: matrix.cmake_flags == '-DCODE_COVERAGE=ON'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ${{ steps.strings.outputs.build-output-dir }}/coverage.html
