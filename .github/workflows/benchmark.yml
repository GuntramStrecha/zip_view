name: Benchmarks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:  # Allow manual triggering

env:
  VERBOSE: 1

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            build_dir: build
            cmake_flags: ""
            cxx_compiler: clang++
            run_prefix: ""
          - arch: x86_32
            runner: ubuntu-latest
            build_dir: build-x86_32
            cmake_flags: "-DCMAKE_CXX_FLAGS=-m32"
            cxx_compiler: g++
            run_prefix: ""
          - arch: arm64
            runner: ubuntu-24.04-arm
            build_dir: build-arm
            cmake_flags: ""
            cxx_compiler: clang++
            run_prefix: ""
          - arch: arm32
            runner: ubuntu-24.04-arm
            build_dir: build-arm32
            cmake_flags: "-DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=arm"
            cxx_compiler: arm-linux-gnueabihf-g++
            run_prefix: "qemu-arm -L /usr/arm-linux-gnueabihf"

    runs-on: ${{ matrix.runner }}
    name: benchmark-${{ matrix.arch }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up CMake
      uses: lukka/get-cmake@latest

    - name: Install x86 32-bit toolchain and runtime
      if: matrix.arch == 'x86_32'
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y g++-multilib libc6:i386 libstdc++6:i386

    - name: Install ARM 32-bit toolchain and runtime
      if: matrix.arch == 'arm32'
      run: |
        sudo dpkg --add-architecture armhf
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf qemu-user libc6-armhf-cross libstdc++6-armhf-cross

    - name: Configure CMake
      run: >
        cmake -B ${{ github.workspace }}/${{ matrix.build_dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }}
        -DCMAKE_BUILD_TYPE=Release
        ${{ matrix.cmake_flags }}
        -S ${{ github.workspace }}

    - name: Build Benchmarks
      run: cmake --build ${{ github.workspace }}/${{ matrix.build_dir }} --config Release --target ZipViewBenchmark

    - name: Run Benchmarks
      run: |
        cd ${{ github.workspace }}/${{ matrix.build_dir }}
        ${{ matrix.run_prefix }} ./benchmarks/ZipViewBenchmark --benchmark_format=json --benchmark_out=benchmark_results.json 2>&1

    - name: Upload Benchmark Results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results-${{ matrix.arch }}
        path: |
          ${{ github.workspace }}/${{ matrix.build_dir }}/benchmark_results.json

  merge-results:
    needs: benchmark
    if: success()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download all benchmark artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: benchmark-results-*
        path: artifacts
        merge-multiple: false

    - name: Merge benchmark results
      run: |
        mkdir -p merged
        python3 ./.github/scripts/merge_benchmarks.py --artifacts-dir artifacts --out-dir merged
        echo "Merged files:" && ls -l merged || true

    - name: Create summary markdown
      run: |
        echo "Summary created by merge script:"
        cat merged/benchmark_summary.md || echo "(no summary file found)"

    - name: Upload merged results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results-merged
        path: |
          merged/benchmark_results_merged.json
          merged/benchmark_summary.md

    - name: Add to Job Summary
      if: always()
      run: |
        cat merged/benchmark_summary.md >> $GITHUB_STEP_SUMMARY

  push-results:
    needs: merge-results
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download merged benchmark results
      uses: actions/download-artifact@v4
      with:
        name: benchmark-results-merged
        path: artifacts

    - name: Store benchmark results
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: C++ Benchmark
        tool: 'customSmallerIsBetter'
        output-file-path: artifacts/benchmark_results_merged.json
        gh-pages-branch: gh-pages
        benchmark-data-dir-path: dev/bench
        auto-push: true
        github-token: ${{ secrets.GITHUB_TOKEN }}
        max-items-in-chart: 999
        skip-fetch-gh-pages: false
        comment-always: false
        summary-always: false
        save-data-file: true
        comment-on-alert: false
        alert-threshold: 120%
        fail-on-alert: true
