name: Architecture

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:  # Allow manual triggering

env:
  VERBOSE: 1

jobs:
  cpp11-compatibility:
    name: C++11 Strict Compile
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check C++11 compatibility (strict compile)
      run: |
        echo "Checking C++11 compatibility with strict flags..."
        g++ -std=c++11 -pedantic -Werror -Wall -Wextra -Wconversion \
          -I include/ -c include/zip_view.hpp -o /tmp/zip_view.o
        echo "✓ C++11 compatibility verified"

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install libclang and python bindings for AST checks
      run: |
        sudo apt-get update
        sudo apt-get install -y libclang-dev python3-pip
        python3 -m pip install --upgrade pip
        python3 -m pip install clang

    - name: Run unified architecture validation script
      run: |
        echo "Running combined architecture validation (clang-tidy + scripted checks)..."
        chmod +x scripts/check_architecture.sh
        ./scripts/check_architecture.sh


  architecture-tests:
    name: Architecture Test Suite
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_CXX_COMPILER=g++ \
          -DCMAKE_BUILD_TYPE=Release \
          -S .

    - name: Build tests
      run: cmake --build build --target ZipViewTests

    - name: Run architecture tests
      run: ./build/tests/ZipViewTests "[architecture]"

  clang-tidy-checks:
    name: Clang-Tidy Analysis
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install clang-tidy and build deps
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy libclang-dev python3-pip clang llvm-dev libllvm-dev
        python3 -m pip install --upgrade pip
        python3 -m pip install clang

    - name: Configure CMake (enable custom clang-tidy plugin)
      run: |
        cmake -B build \
          -DCMAKE_CXX_COMPILER=g++ \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DBUILD_CLANG_TIDY_CHECKS=ON \
          -S .

    - name: Build clang-tidy plugin
      run: |
        # Build the custom clang-tidy plugin. Fail the job if plugin can't be built to ensure checks are enforced.
        cmake --build build --target zipview_tidy

    - name: Run clang-tidy architecture checks
      run: |
        chmod +x scripts/run_clang_tidy.sh
        ./scripts/run_clang_tidy.sh 2>&1 | tee clang-tidy-output.txt
        # Check for architecture-critical warnings
        if grep -E "(cppcoreguidelines-owning-memory|performance-)" clang-tidy-output.txt | grep -v "Suppressed"; then
          echo "WARNING: Found architecture-relevant clang-tidy warnings"
          # Don't fail the build for warnings, but show them
        fi

  summary:
    name: Architecture Summary
    runs-on: ubuntu-latest
    needs: [cpp11-compatibility, static-analysis, architecture-tests, clang-tidy-checks]
    if: success()

    steps:
    - name: Summary
      run: |
        echo "============================================"
        echo "✓ All architecture checks passed"
        echo "============================================"
        echo "- C++11 compatibility verified"
        echo "- Header-only constraint verified"
        echo "- Zero-cost abstraction maintained"
        echo "- Namespace structure correct"
        echo "- Architecture tests passed"
        echo "- Clang-tidy checks completed"
        echo "============================================"
